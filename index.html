<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>제물포 복지지도</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>제물포 복지지도</h1>
    <p>우리 동네 복지기관을 한 눈에</p>
  </header>

  <nav class="menu" aria-label="복지 분야">
    <button class="active" data-category="전체">전체</button>
    <button data-category="어르신">어르신</button>
    <button data-category="장애인">장애인</button>
    <button data-category="여성/아동">여성/아동</button>
    <button data-category="한부모/다문화">한부모/다문화</button>
    <button data-category="복지관/자활">복지관/자활</button>
    <button data-category="건강/재활">건강/재활</button>
    <button data-category="대피소">대피소</button>
    <button data-category="쉼터">쉼터</button>
  </nav>

  <main class="layout">
    <section class="list">
      <input id="search" class="search" type="search" placeholder="이름·동·대상·하는 일 (예: 치매)" aria-label="기관 검색">
      <h2>기관 목록 <span id="count"></span></h2>
      <p class="notice">출처: 공공데이터포털 제물포구 자료, 제물포구청·보건소 홈페이지, 인천시 자료, 국민안전24(대피소·쉼터), 각 기관 홈페이지 (2026년 10월 확인). '대상'과 '하는 일'은 시설 종류에 따른 일반 안내에 구청에서 확인한 기관별 사업을 더한 것이라 기관마다 다를 수 있습니다. 방문 전 전화로 확인하세요.</p>
      <div id="cards"></div>
    </section>

    <section class="map" id="map" aria-label="지도">
      <p><strong>지도를 불러오지 못했습니다.</strong><br>'실행.bat'을 더블클릭해서 열어 주세요.</p>
    </section>
  </main>

  <!-- 기관 이름을 누르면 열리는 상세정보 창 (script.js의 openDetail) -->
  <dialog id="detail" class="detail" aria-labelledby="detail-name">
    <button class="close" type="button" aria-label="닫기">✕</button>
    <div id="detail-body"></div>
  </dialog>

  <!-- 카카오 지도 JavaScript 키: developers.kakao.com 에 등록한 주소에서만 작동합니다 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=5ccf8384fc379837ac46da7b9356a95c&autoload=false&libraries=clusterer"></script>
  <script src="facilities.js"></script>
  <script src="script.js"></script>
</body>
</html>
